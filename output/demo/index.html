<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例聊天</title>
<style>
  :root {
    --bg: #ededed;
    --mine: #95ec69;
    --other: #ffffff;
    --time: #b2b2b2;
    --transfer: #f6c98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: #111;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 15px;
  }
  .toolbar {
    position: sticky;
    top: 0;
    padding: 14px 18px 8px;
    background: linear-gradient(#ededed, rgba(237,237,237,.92));
  }
  .toolbar input {
    width: 220px;
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    font: inherit;
    background: #fff;
    outline: none;
  }
  .chat { padding: 8px 18px 40px; }
  .time {
    text-align: center;
    color: var(--time);
    font-size: 12px;
    margin: 18px 0 14px;
  }
  .system {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin: 10px 0;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 14px 0;
  }
  .row.self { flex-direction: row-reverse; }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: cover;
    background: #2b2b2b;
    flex: none;
  }
  .content { max-width: min(420px, 72vw); }
  .bundle {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .bubble {
    background: var(--other);
    border-radius: 4px;
    padding: 9px 12px;
    line-height: 1.55;
    max-width: 320px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .row.self .bubble { background: var(--mine); }
  .side-image, .photo {
    display: block;
    max-width: 220px;
    max-height: 280px;
    border-radius: 4px;
  }
  .side-image { width: 72px; height: 54px; object-fit: cover; }
  .voice-line {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 88px;
  }
  .voice-text {
    margin-top: 6px;
    color: #666;
    font-size: 13px;
  }
  .transfer {
    width: 230px;
    background: var(--transfer);
    color: #fff;
    border-radius: 4px;
    padding: 12px 14px 8px;
  }
  .transfer.pending { background: #fa9d3b; }
  .transfer-main { display: flex; gap: 10px; align-items: center; }
  .transfer-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    color: #e39b3a;
    display: grid;
    place-items: center;
    font-size: 18px;
    flex: none;
  }
  .fee { font-size: 16px; }
  .status { font-size: 12px; opacity: .95; }
  .transfer-foot {
    margin-top: 10px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,.45);
    font-size: 12px;
  }
  .card {
    background: #fff;
    border-radius: 4px;
    padding: 10px 12px;
    min-width: 180px;
  }
  .card small { color: #888; }
  .quote {
    margin-top: 6px;
    padding: 6px 8px;
    background: rgba(0,0,0,.05);
    border-radius: 3px;
    color: #666;
    font-size: 13px;
  }
  .hidden { display: none !important; }
  @page { size: A4; margin: 12mm; }
  @media print {
    .toolbar { display: none; }
    .row, .time, .transfer, .photo { break-inside: avoid; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="toolbar"><input id="q" type="search" placeholder="搜索"></div>
  <main class="chat" id="chat">
    <div class="row other"><img class="avatar" src="media/avatar-other-0.png" alt=""><div class="bubble">对了，有个急事想麻烦你……能借我点钱吗？月底交房租差点
预算</div></div>
    <div class="row self"><img class="avatar" src="media/avatar-self-2.png" alt=""><div class="bundle"><div class="bubble">可以，具体什么时候还？</div><img class="side-image" src="media/landscape-1.png" alt=""></div></div>
    <div class="row other"><img class="avatar" src="media/avatar-other-0.png" alt=""><div class="bubble">下个月15号发工资立刻还你，谢谢！</div></div>
    <div class="time">2025年4月3日 12:39</div>
    <div class="row other"><img class="avatar" src="media/avatar-other-0.png" alt=""><div class="transfer"><div class="transfer-main"><div class="transfer-icon">✓</div><div><div class="fee">¥ 0.01</div><div class="status">已收款</div></div></div><div class="transfer-foot">微信转账</div></div></div>
    <div class="row other"><img class="avatar" src="media/avatar-other-0.png" alt=""><div class="bubble"><div class="voice-line"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#333" d="M3 9v6h4l5 4V5L7 9H3z"/><path fill="none" stroke="#333" stroke-width="2" d="M16 9a4 4 0 010 6"/></svg><span>3&quot;</span></div><div class="voice-text">好的兄弟，谢谢谢谢
谢谢兄弟。</div></div></div>
    <div class="time">2025年4月3日 14:25</div>
    <div class="row other"><img class="avatar" src="media/avatar-other-0.png" alt=""><img class="photo" src="media/landscape-1.png" alt="图片"></div>
    <div class="row other"><img class="avatar" src="media/avatar-other-0.png" alt=""><div class="bubble">天气不错，有空出来一起露营🌲</div></div>
    <div class="time">2025年12月3日 10:45</div>
  </main>
<script>
  const q = document.getElementById("q");
  q.addEventListener("input", () => {
    const word = q.value.trim().toLowerCase();
    document.querySelectorAll(".row").forEach((row) => {
      const text = row.innerText.toLowerCase();
      row.classList.toggle("hidden", word && !text.includes(word));
    });
  });
</script>
</body>
</html>
